# Prometheus configuration for the Act 1 baseline (traditional, threshold-based monitoring).
global:
  scrape_interval: 5s # short on purpose: the fair demo must react in seconds
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"] # Collector internal metrics
      - targets: ["otel-collector:8889"] # metrics re-exported from the OTLP pipeline
        labels:
          pipeline: otlp-export

  # --- Black-box probes (service availability and latency as seen from the network) ---------
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web/
          - http://api/health
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - web:80
          - api:80
    relabel_configs: *blackbox_relabel

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - web
          - api
    relabel_configs: *blackbox_relabel

  # --- Extension point for Act 2 --------------------------------------------------------------
  # Drop a YAML file in prometheus/targets/ (file_sd format) to add scrape targets without
  # editing this file. Example:
  #   - targets: ["detector:8000"]
  #     labels: { job_hint: anomaly-detector }
  - job_name: extra
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
        refresh_interval: 10s
