# blackbox_exporter modules used by the Act 1 baseline.
modules:
  http_2xx:
    prober: http
    timeout: 3s
    http:
      method: GET
      valid_status_codes: [] # defaults to 2xx
      preferred_ip_protocol: ip4

  tcp_connect:
    prober: tcp
    timeout: 3s
    tcp:
      preferred_ip_protocol: ip4

  icmp:
    prober: icmp
    timeout: 3s
    icmp:
      preferred_ip_protocol: ip4
