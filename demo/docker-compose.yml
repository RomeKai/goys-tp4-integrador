# Demo TP4 - Acto 1: "monitoreo tradicional" (todo en verde, alertas por umbral).
# Todas las imagenes estan fijadas por version (sin "latest") para que la demo sea
# reproducible y se pueda guardar/cargar offline (ver scripts/).
#
# Extension points for Act 2 (NOT implemented here):
#   1. Network "demo-net" is a plain bridge with fixed subnet 172.28.0.0/24. Act 2 can attach an
#      extra container (traffic generator / port scanner / latency injector) with an override file:
#        docker compose -f docker-compose.yml -f docker-compose.act2.yml up -d
#      and reach "web" and "api" by service name or by their fixed IPs below.
#   2. Prometheus reads extra scrape targets from prometheus/targets/*.yml (file_sd), so the
#      Act 2 detector/exporter can be registered without editing prometheus.yml.
#   3. Prometheus reads alert rules from prometheus/rules/*.yml; Act 2 may add rule files there.
#   4. Latency injection can be done with `tc netem` inside a container that has NET_ADMIN.

name: goys-demo

x-restart: &restart
  restart: unless-stopped

networks:
  demo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  prometheus-data:
  grafana-data:

services:
  # --- Small internal targets (what we monitor) -------------------------------------------
  web:
    image: nginx:1.27.2-alpine
    <<: *restart
    networks:
      demo-net:
        ipv4_address: 172.28.0.10
    # Port 80 is intentionally NOT published to the host: it is an internal service.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    image: nginx:1.27.2-alpine
    <<: *restart
    networks:
      demo-net:
        ipv4_address: 172.28.0.11
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- Probes and host metrics ------------------------------------------------------------
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    <<: *restart
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    cap_add:
      - NET_RAW # required for ICMP probes
    networks:
      demo-net:
        ipv4_address: 172.28.0.20
    depends_on:
      - web
      - api

  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: *restart
    # Reports the Docker Desktop Linux VM (not the Windows host); no host mounts for portability.
    networks:
      demo-net:
        ipv4_address: 172.28.0.21

  # --- Telemetry pipeline -------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    <<: *restart
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP intake published on loopback only. Act 3 failure scenario: this endpoint has NO TLS/mTLS.
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    networks:
      demo-net:
        ipv4_address: 172.28.0.22

  # --- Prometheus + Grafana ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      demo-net:
        ipv4_address: 172.28.0.30
    depends_on:
      - blackbox
      - node-exporter
      - otel-collector

  grafana:
    image: grafana/grafana:11.3.0
    <<: *restart
    environment:
      # Demo-only credentials; override through .env (copy .env.example). Never commit .env.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous read-only access so the audience can see dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/act1-monitoreo-tradicional.json
      # Offline operation: no telemetry, no update checks.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      demo-net:
        ipv4_address: 172.28.0.31
    depends_on:
      - prometheus
