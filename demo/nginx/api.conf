# Minimal "api" service: JSON health endpoint plus a small status endpoint.
server {
    listen 80;
    server_name _;

    default_type application/json;

    location = /health {
        access_log off;
        return 200 '{"status":"ok"}\n';
    }

    location / {
        return 200 '{"service":"api","version":"demo"}\n';
    }
}
